[build]
  command = "npm run build:local"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_SANITY_PROJECT_ID = "uieb2l00"
  PUBLIC_SANITY_DATASET = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
